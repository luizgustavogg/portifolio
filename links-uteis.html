<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Links Úteis | Luiz Gustavoo</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/vendor/boxicons/css/boxicons.min.css" />
    <link rel="stylesheet" href="assets/css/links.css">
  </head>
  <body>
    <main class="wrap">
      <section class="top">
        <div class="brand">
          <div class="avatar"><img src="assets/img/logo2.png" alt="" /></div>
          <div>
            <h1>Luiz Gustavo</h1>
            <p class="subtitle">
              🌐 Transformando negócio em sucesso digital. 🚀
            </p>
          </div>
        </div>
        <nav class="icons">
          <a
            class="ibtn"
            href="https://www.instagram.com/luizgustavo.gg/"
            target="_blank"
            rel="noreferrer"
            ><i class="bx bxl-instagram"></i
          ></a>
          <a
            class="ibtn"
            href="http://wa.me/+5588921510882"
            target="_blank"
            rel="noreferrer"
            ><i class="bx bxl-whatsapp"></i
          ></a>
          <a
            class="ibtn"
            href="https://github.com/luizgustavogg"
            target="_blank"
            rel="noreferrer"
            ><i class="bx bxl-github"></i
          ></a>
          <a
            class="ibtn"
            href="https://www.behance.net/luizgustavogg"
            target="_blank"
            rel="noreferrer"
            ><i class="bx bxl-behance"></i
          ></a>
        </nav>
      </section>
      <!-- ........... -->
      <section class="grid">
        <article class="card tall">
          <img src="assets/img/link (1).avif" alt="" />
          <a
            class="cta"
            href="http://wa.me/+5588921510882"
            target="_blank"
            rel="noreferrer"
            >Fazer um orçamento<i class="bx bx-right-arrow-alt"></i
          ></a>
        </article>

        <article class="card video-card">
          <div class="video-pad">
            <video
              autoplay
              muted
              loop
              playsinline
              poster="assets/img/link (2).avif"
            >
              <source src="assets/img/link (1).mp4" type="video/mp4" />
            </video>
          </div>
        </article>

        <aside class="stack-card">
          <div class="stack-inner">
            <a
              class="pill"
              href="https://github.com/luizgustavogg"
              target="_blank"
              rel="noreferrer"
            >
              <i class="bx bxl-github"></i>
              <div>
                <h3>GitHub</h3>
                <p>github.com</p>
              </div>
              <i class="bx bx-right-arrow-alt go"></i>
            </a>
            <a
              class="pill behance"
              href="https://www.behance.net/luizgustavogg"
              target="_blank"
              rel="noreferrer"
            >
              <i class="bx bxl-behance"></i>
              <div>
                <h3>Behance</h3>
                <p>behance.net</p>
              </div>
              <i class="bx bx-right-arrow-alt go"></i>
            </a>
            <a
              class="pill ig"
              href="https://www.instagram.com/luizgustavo.gg/"
              target="_blank"
              rel="noreferrer"
            >
              <i class="bx bxl-instagram"></i>
              <div>
                <h3>Instagram</h3>
                <p>@luizgustavo.gg</p>
              </div>
              <i class="bx bx-right-arrow-alt go"></i>
            </a>
            <a
              class="pill linkedin"
              href="https://www.linkedin.com/in/luiz-gustavo-de-sousa-marques-749b70240/"
              target="_blank"
              rel="noreferrer"
            >
              <i class="bx bxl-linkedin-square"></i>
              <div>
                <h3>LinkedIn</h3>
                <p>@luizgustavo</p>
              </div>
              <i class="bx bx-right-arrow-alt go"></i>
            </a>
          </div>
        </aside>

        <a
          class="card banner"
          href="https://www.behance.net/luizgustavogg"
          target="_blank"
          rel="noreferrer"
        >
          <img src="assets/img/link (2).avif" alt="" />
        </a>
      </section>
    </main>
  </body>
</html>
